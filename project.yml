# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: CLITollgate
options:
  bundleIdPrefix: io.github.dylancetin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

targets:
  CLITollgate:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: CLI Tollgate
        CFBundleDisplayName: CLI Tollgate
        # English and Turkish (App/Resources/*.lproj). macOS picks Turkish when
        # it is the user's preferred language.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "CLI Tollgate. Bundles CLIProxyAPI (MIT)."
        # Sparkle: the feed is the appcast.xml attached to the latest GitHub release.
        SUFeedURL: https://github.com/dylancetin/cli-tollgate/releases/latest/download/appcast.xml
        SUPublicEDKey: JEcjqZEN3+v14zLeix+J+jfPd+92NyLxPwLtcjSvk4Y=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: CLI Tollgate
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dylancetin.cli-tollgate
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # Ad-hoc signing: no Apple Developer ID. Updates are verified by Sparkle's EdDSA key.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed proxy engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ENGINE="${SRCROOT}/build/engine/tollgate-engine"
          if [ ! -f "$ENGINE" ]; then
            echo "error: ${ENGINE} is missing. Run scripts/build-engine.sh on macOS first."
            exit 1
          fi
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/tollgate-engine"
          mkdir -p "$(dirname "$DEST")"
          cp -f "$ENGINE" "$DEST"
          chmod 755 "$DEST"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RES"
          cp -f "${SRCROOT}/build/engine/engine-commit.txt" "$RES/engine-commit.txt" || true

schemes:
  CLITollgate:
    build:
      targets:
        CLITollgate: all
    run:
      config: Debug
    archive:
      config: Release
